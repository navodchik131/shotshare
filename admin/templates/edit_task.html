{% extends "base.html" %}

{% block title %}Редактировать задание - ShotShare Admin{% endblock %}

{% block content %}
<div class="card">
    <h2>Редактировать задание</h2>
    <form method="POST">
        <div class="form-group">
            <label for="text">Текст задания</label>
            <textarea id="text" name="text" required>{{ task.text }}</textarea>
        </div>
        <div class="form-group">
            <label for="scheduled_date">Дата отправки (UTC)</label>
            <input type="date" id="scheduled_date" name="scheduled_date" 
                   value="{{ task.scheduled_time.strftime('%Y-%m-%d') }}" required>
            <small style="color: #666; display: block; margin-top: 0.25rem;">Время хранится в UTC</small>
        </div>
        <div class="form-group">
            <label for="scheduled_time">Время отправки (UTC)</label>
            <input type="time" id="scheduled_time" name="scheduled_time" 
                   value="{{ task.scheduled_time.strftime('%H:%M') }}" required>
            <small style="color: #666; display: block; margin-top: 0.25rem;">Время в формате UTC (24-часовой формат)</small>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="is_active" {% if task.is_active %}checked{% endif %}>
                Активно
            </label>
        </div>
        <button type="submit" class="btn">Сохранить</button>
        <a href="{{ url_for('tasks') }}" class="btn" style="background: #95a5a6; margin-left: 1rem;">Отмена</a>
    </form>
</div>
{% endblock %}
